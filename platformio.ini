; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; COM3 is the board: "Silicon Labs CP210x USB to UART Bridge",
; USB\VID_10C4&PID_EA60. Confirm with `pio device list` before changing it.
;
; Do NOT set this to COM1. COM1 exists on this machine as ACPI\PNP0501 - the
; motherboard's legacy serial port, with nothing attached. It looks like a
; valid choice in Device Manager, and pointing esptool at it produces
; "Failed to connect to ESP32: No serial data received", which reads like a
; dead board rather than an empty port.
;
; If the number really does move (different USB socket, or another CP210x
; device plugged in), re-run `pio device list` and use the port whose
; description names the CP210x bridge.
upload_port = COM3
monitor_port = COM3

; The esp32dev board manifest defaults upload_speed to 460800. At that rate this
; board produced:
;
;   A fatal error occurred: Serial data stream stopped: Possible serial noise
;   or corruption
;
; which is not a dead board and not a wrong port - esptool had already
; handshaked, so it got as far as pushing flash data and the stream broke. The
; CP210x bridge, the cable and a rail with modules hanging off it do not all
; hold 460800 reliably. 115200 always works; the cost is roughly 90 s per
; upload instead of 25 s, which is a trade worth making during bring-up.
;
; Raise this back to 460800 (or delete the line) once the hardware is in the
; case and uploads are rare.
upload_speed = 115200

; Stamps `git describe` into the build as FIRMWARE_VERSION, so the version a
; unit reports is the commit it is actually running rather than whatever was
; typed into SET months ago. See inject_version.py.
extra_scripts = pre:inject_version.py

; Provisioning is typed into this monitor (SET / SECRET / SHOW), and by
; default it shows nothing of what you type, which reads exactly like a
; monitor that is not listening.
;
;   monitor_echo     shows your own keystrokes
;   send_on_enter    holds the line until you press Enter, instead of sending
;                    each character as it is struck - so a 64-character secret
;                    can be pasted and corrected before it is sent
;   monitor_eol      ends the line with \n, which is what the parser expects
;   log2file         also writes everything to
;                    platformio-device-monitor-YYMMDD-HHMMSS.log in the project
;                    root. Added because a boot log showing an I2C fault was
;                    lost when the terminal was closed, and the terminal is the
;                    only place this output has ever existed - PlatformIO keeps
;                    no copy and neither does the ESP32. A demo also scrolls
;                    past VS Code's default 1000-line buffer in minutes.
monitor_echo = yes
monitor_eol = LF
; One per line, matching lib_deps below. Commas parse identically; note that
; plain `pio project config` prints only the first value of a multi-value
; option, so check with `pio project config --json-output` before concluding
; that a filter was dropped.
monitor_filters =
	send_on_enter
	log2file
lib_deps =
	adafruit/Adafruit MPU6050@^2.2.6
	adafruit/Adafruit Unified Sensor@^1.1.14
	bblanchon/ArduinoJson@^7.2.1
	mikalhart/TinyGPSPlus@^1.1.0
	vshymanskyy/TinyGSM@^0.12.0
	arduino-libraries/ArduinoHttpClient@^0.6.1
	plerup/EspSoftwareSerial@^8.2.0
	dfrobot/DFRobotDFPlayerMini@^1.0.6