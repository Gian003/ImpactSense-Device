; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM3
monitor_port = COM3

; Provisioning is typed into this monitor (SET / SECRET / SHOW), and by
; default it shows nothing of what you type, which reads exactly like a
; monitor that is not listening.
;
;   monitor_echo     shows your own keystrokes
;   send_on_enter    holds the line until you press Enter, instead of sending
;                    each character as it is struck - so a 64-character secret
;                    can be pasted and corrected before it is sent
;   monitor_eol      ends the line with \n, which is what the parser expects
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
lib_deps =
	adafruit/Adafruit MPU6050@^2.2.6
	adafruit/Adafruit Unified Sensor@^1.1.14
	bblanchon/ArduinoJson@^7.2.1
	mikalhart/TinyGPSPlus@^1.1.0
	vshymanskyy/TinyGSM@^0.12.0
	arduino-libraries/ArduinoHttpClient@^0.6.1
	plerup/EspSoftwareSerial@^8.2.0
	dfrobot/DFRobotDFPlayerMini@^1.0.6